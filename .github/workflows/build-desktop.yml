name: Build desktop assistant
on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'cloud-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release version, for example v0.1.9 or cloud-v0.1.9'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch ]]; then
            echo 'Branch push: test and build without publishing a release.'
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$RELEASE_TAG" in
            cloud-v*) ;;
            v*) RELEASE_TAG="cloud-$RELEASE_TAG" ;;
            [0-9]*) RELEASE_TAG="cloud-v$RELEASE_TAG" ;;
          esac
          if [[ ! "$RELEASE_TAG" =~ ^cloud-v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo '::error::Invalid version. Enter v0.1.9 or cloud-v0.1.9.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::This release already exists. Use a new version; published files must not be overwritten.'
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::This tag already exists. Use a new version or run the workflow triggered by that tag.'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.lock
      - run: python -m pip install -r desktop/requirements.lock
      - run: python -m unittest discover -s desktop/tests -v
      - run: python desktop/packaging/build.py ${{ needs.prepare.outputs.tag != '' && format('--version {0}', needs.prepare.outputs.tag) || '' }}
      - name: Smoke check packaged desktop application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python desktop/tests/packaged_smoke.py dist/LynkCoHelper/LynkCoHelper.exe
          else
            python desktop/tests/packaged_smoke.py dist/LynkCoHelper.app/Contents/MacOS/LynkCoHelper
          fi
      - name: Smoke check Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Resolve-Path dist/LynkCoHelper/LynkCoHelper.exe
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) {
            $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter mt.exe |
              Where-Object { $_.FullName -notmatch '\\arm64\\mt\.exe$' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mt) { throw 'Windows manifest tool is unavailable.' }
          $embedded = Join-Path $env:RUNNER_TEMP 'lynkco-desktop-package.manifest'
          & $mt "-inputresource:$package;#1" "-out:$embedded"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Windows desktop package manifest.' }
          if ((Get-Content $embedded -Raw) -notmatch 'PerMonitorV2</dpiAwareness>') { throw 'PerMonitorV2 is missing from the Windows desktop package manifest.' }
      - run: python desktop/packaging/build_release.py --tag "$RELEASE_TAG" --platform "$PLATFORM"
        if: needs.prepare.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.tag != ''
        with:
          name: LynkCoHelper-cloud-${{ matrix.platform }}
          path: release/
          retention-days: 7
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LynkCoHelper-cloud-*
          merge-multiple: true
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do assets+=("$asset"); done < <(find release -maxdepth 1 -type f -print0)
          ((${#assets[@]} > 0)) || { echo 'No release files found'; exit 1; }
          gh release create "$RELEASE_TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "LynkCoHelper $RELEASE_TAG" --generate-notes
